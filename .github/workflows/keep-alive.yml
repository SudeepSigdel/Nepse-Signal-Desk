name: Keep Repo Active

# Ping repo every 2 hours to keep scheduled workflows active
on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp file
        run: |
          date > .github/last-activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          git commit -m "chore: keep repo active for scheduled workflows" || true
          git push || true
