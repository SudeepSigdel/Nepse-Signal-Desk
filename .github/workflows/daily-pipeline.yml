name: Daily Pipeline

on:
  # Run daily at 12:15 UTC, which is 6:00 PM Nepal time (UTC+05:45).
  schedule:
    - cron: '15 12 * * *'
  # Trigger on pushes and pull requests so CI runs for every commit and PR
  push: {}
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect pipeline-relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline:
              - 'scrapper/**'
              - 'automation/**'
              - 'src/**'
              - 'requirements.txt'
              - '.github/workflows/daily-pipeline.yml'

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build

  run-pipeline:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always()

    concurrency:
      group: daily-pipeline
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Remove stale pipeline lock
        run: |
          rm -f data/processed/.daily_pipeline.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python code
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install pytest
          python -m compileall app src automation scrapper
          python -m pytest tests -q

      - name: Run daily pipeline
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main' && needs.changes.outputs.pipeline == 'true')
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Starting daily pipeline at $(date -u)"
          python automation/daily_pipeline.py --source sharesansar --delay 0.2 --model-family both
          echo "Pipeline completed at $(date -u)"

      - name: Commit updated data
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main' && needs.changes.outputs.pipeline == 'true'))
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_LFS_SKIP_SMUDGE=1

          # This step can start from a base that's hours stale (the pipeline
          # run above takes a while), and other commits — including other
          # data refreshes — may have landed on origin since. `git pull
          # --rebase` would try to reconcile that as a content merge, which
          # fails outright on binary files (parquet/pkl can't be line-merged)
          # if two independent full regenerations touched the same file.
          # There's nothing to "merge" here anyway — a full regeneration
          # should just replace whatever was there. So: fetch the true
          # current tip right before committing, and build the new commit
          # directly on top of it via `reset --soft` (index/ref only, never
          # touches the working tree) rather than rebasing a diff onto it.
          git fetch origin "$BRANCH"
          LAST_SUBJECT=$(git log -1 --pretty=%s "origin/$BRANCH")

          if [[ "$LAST_SUBJECT" == "chore: refresh daily pipeline outputs"* ]]; then
            # origin's trailing commit is already just a data dump — replace
            # it outright instead of stacking a new one, so full binary blobs
            # (no LFS) don't grow history forever.
            git reset --soft "origin/$BRANCH~1"
          else
            git reset --soft "origin/$BRANCH"
          fi

          git add -f data/raw data/processed outputs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh daily pipeline outputs $(date -u +'%Y-%m-%d %H:%M:%S')"

          if [[ "$LAST_SUBJECT" == "chore: refresh daily pipeline outputs"* ]]; then
            git push --force-with-lease origin "HEAD:$BRANCH"
          else
            git push origin "HEAD:$BRANCH"
          fi

      - name: Upload logs and outputs
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main' && needs.changes.outputs.pipeline == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: daily-pipeline-artifacts
          path: |
            outputs/**
            data/processed/**
            data/raw/**
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Daily pipeline failed at $(date -u)"
          echo "Check workflow logs for details"
          exit 1

