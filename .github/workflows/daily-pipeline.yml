name: Daily Pipeline

on:
  schedule:
    # Run daily at 11:15 UTC. Adjust if you want a different market-close window.
    - cron: '15 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    concurrency:
      group: daily-pipeline
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Remove stale pipeline lock
        run: |
          rm -f data/processed/.daily_pipeline.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Starting NEPSE scraper at $(date -u)"
          python "scrapper/Nepse Scraper.py" --source sharesansar --delay 0.2
          echo "Scraper completed at $(date -u)"

      - name: Run daily pipeline
        env:
          MPLBACKEND: Agg
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Starting daily pipeline at $(date -u)"
          python automation/daily_pipeline.py --source sharesansar --delay 0.2 --skip-scrape
          echo "Pipeline completed at $(date -u)"

      - name: Commit updated data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed outputs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh daily pipeline outputs $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push

      - name: Upload logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-pipeline-artifacts
          path: |
            outputs/**
            data/processed/**
            data/raw/**
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Daily pipeline failed at $(date -u)"
          echo "Check workflow logs for details"
          exit 1

