# ════════════════════════════════════════════════════════════
# docker-compose.yml — Local Development Stack
# Usage: docker-compose up
# ════════════════════════════════════════════════════════════

version: '3.9'

services:
  # Backend API
  backend:
    build: .
    ports:
      - '8000:8000'
    environment:
      ENV: development
      DEBUG: 'true'
      LOG_LEVEL: INFO
      CORS_ORIGINS: 'http://localhost:3000,http://localhost:5000,http://frontend:3000'
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (optional, build separately)
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     VITE_API_BASE_URL: http://backend:8000
  #   depends_on:
  #     - backend

volumes:
  data:
  outputs:
