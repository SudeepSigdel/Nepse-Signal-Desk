# ════════════════════════════════════════════════════════════
# docker-compose.yml — Local Development Stack
# Usage: docker-compose up
# ════════════════════════════════════════════════════════════

version: '3.9'

services:
  # Backend API
  backend:
    build: .
    ports:
      - '8000:8000'
    environment:
      ENV: development
      DEBUG: 'true'
      LOG_LEVEL: INFO
      CORS_ORIGINS: 'http://localhost:3000,http://localhost:5000,http://frontend:3000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import requests; requests.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (optional, build separately)
