# ════════════════════════════════════════════════════════════
# docker-compose.prod.yml — Production Stack (Azure VM)
# Usage: docker compose -f docker-compose.prod.yml up -d
# ════════════════════════════════════════════════════════════

version: '3.9'

services:
  backend:
    image: ghcr.io/sudeepsigdel/fyp:latest
    container_name: nepse_backend
    restart: always
    ports:
      - '8000:8000'
    environment:
      ENV: production
      DEBUG: 'false'
      LOG_LEVEL: INFO
    healthcheck:
      test: ['CMD', 'python', '-c', "import requests; requests.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
