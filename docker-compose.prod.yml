# ════════════════════════════════════════════════════════════
# docker-compose.prod.yml — Production Stack (Azure VM)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Deploys are pushed by .github/workflows/deploy.yml over SSH after a
# successful image build — there is no in-VM auto-updater (previously
# watchtower, removed: its image is unmaintained and couldn't talk to a
# current Docker Engine API, so it silently stopped auto-deploying).
# ════════════════════════════════════════════════════════════

services:
  # One-shot: applies pending Alembic migrations to DATABASE_URL (from .env)
  # with the same image, then exits. The backend only starts once it has
  # succeeded, so every deploy migrates first; if a migration fails, compose
  # stops before replacing the running backend.
  migrate:
    image: ghcr.io/sudeepsigdel/fyp:latest
    container_name: nepse_migrate
    env_file:
      - .env
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'

  backend:
    image: ghcr.io/sudeepsigdel/fyp:latest
    container_name: nepse_backend
    restart: always
    ports:
      - '8000:8000'
    # Real secrets (DATABASE_URL, SECRET_KEY, GOOGLE_CLIENT_ID/SECRET,
    # CORS_ORIGINS, etc.) live in a .env file next to this compose file on
    # the VM — never committed. See .env.example for the full list.
    env_file:
      - .env
    environment:
      ENV: production
      DEBUG: 'false'
      LOG_LEVEL: INFO
      REDIS_URL: redis://redis:6379/0
      # Live quotes + holiday-aware market status; overrides NEPSE_API_URL in .env.
      NEPSE_API_URL: http://nepseapi:8000
      # Each worker holds the dataset + models in memory (~0.8 GB), so raise this only
      # if the host has room; Redis keeps the cache shared across workers either way.
      WEB_CONCURRENCY: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      # Started with the backend (deploys run `up -d backend`), but not waited on:
      # the backend works without it.
      nepseapi:
        condition: service_started
    healthcheck:
      test: ['CMD', 'python', '-c', "import requests; requests.get('http://localhost:8000/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # NepseAPI-Unofficial (upstream image): live NEPSE quotes and market status
  # for paper trading. Internal only - no published ports; the backend reaches
  # it at http://nepseapi:8000. If it is down or NEPSE blocks it, the backend
  # falls back to end-of-day prices and the trading calendar.
  nepseapi:
    image: surajrimal/nepseapi:latest
    container_name: nepse_live_api
    restart: always

  # Shared response cache + rate-limit counters (optional: the API falls back to
  # in-process memory if Redis is unreachable). Cache only - no persistence needed.
  redis:
    image: redis:7-alpine
    container_name: nepse_redis
    restart: always
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3
